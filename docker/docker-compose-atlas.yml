
services:
  redis:
    image: redis:7
    networks:
      - catalog-api
  tracing:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - catalog-api
  app:
    ports:
      - 8000:8000
    env_file: ../.env
    environment:
      REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tracing:4318/
    build:
      context: ..
      dockerfile: Dockerfile
    networks:
      - catalog-api
    links:
      - redis
      - tracing

networks:
  catalog-api:
