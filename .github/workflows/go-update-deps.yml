name: Update Dependencies

concurrency: ci

on:
    workflow_dispatch:
    schedule:
        - cron: "10 2 * * 0"
    repository_dispatch:
        types:
            - catalog-data-published
            - api-core-published

permissions:
    contents: write

jobs:
    tests:
        name: Update dependencies for ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
            - name: Update dependencies
              run: |
                    git config --global user.email "ci@sweetrpg.com"
                    git config --global user.name "SweetRPG Dependency Updater"
                    git checkout ${{ github.head_ref || github.ref_name }}

                    go get -u ./...
                    go mod tidy

                    git add go.mod go.sum
                    git commit -m "Update dependencies" || exit 0
                    git push origin || exit 0
