name: CI

concurrency: ci-${{ github.ref }}

on:
    push:
        branches: [develop]
        paths:
            - "**/*.go"
            - go.mod
            - go.sum
            - .go-version
    workflow_dispatch:

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          os: ubuntu-latest,
                      }
        steps:
            - uses: actions/checkout@v4
            - name: Get language version
              id: get_lang_version
              run: |
                    v=$(cat .go-version)
                    echo "go_version=$v" >> $GITHUB_OUTPUT
            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                go-version: ${{ steps.get_lang_version.outputs.go_version }}
            - name: Build
              run: go build -v ./...
            - name: Test
              run: go test -v ./...

