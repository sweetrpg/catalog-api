name: Docs

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

# No path filter: dependency bumps in go.mod and hand edits to docs/ also make docs stale.
on:
    pull_request:
        branches: [develop]
    push:
        branches: [develop]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          os: ubuntu-latest,
                      }
        steps:
            - uses: actions/checkout@v7
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version-file: go.mod
            - name: Check docs are current
              env:
                SWAG: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -d cmd/catalog-api/,server/ --parseDependency
              run: |
                    $SWAG
                    stale=$(git status --porcelain --untracked-files=all -- docs/)
                    if [ -n "$stale" ]; then
                        echo "$stale"
                        git diff --stat -- docs/
                        echo "::error::docs/ is out of date. Run this, then commit docs/: $SWAG"
                        exit 1
                    fi
                    echo "docs are up to date"
