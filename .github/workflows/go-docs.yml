name: Docs

concurrency: docs-${{ github.ref }}

on:
    push:
        branches: [develop]
        paths:
            - "**/*.go"
            - "!docs/**"
    workflow_dispatch:

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          os: ubuntu-latest,
                      }
        steps:
            - uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
            - name: Generate docs
              run: |
                    git config --global user.email "ci@sweetrpg.com"
                    git config --global user.name "SweetRPG Depedency Updater"
                    git checkout ${{ github.head_ref || github.ref_name }}

                    go run github.com/swaggo/swag/cmd/swag@latest init -d cmd/catalog-api/,server/

                    git add docs/
                    git commit -m "Generate docs"
                    git push origin
