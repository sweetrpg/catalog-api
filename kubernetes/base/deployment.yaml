---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: api-v1

spec:
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
        type: RollingUpdate
    selector:
        matchLabels:
            app: api
            version: v1
            platform: sweetrpg
            package: catalog
            component: api
    template:
        metadata:
            labels:
                platform: sweetrpg
                app: api
                package: catalog
                component: api
                version: v1
                release: prometheus
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: '/metrics'
                prometheus.io/port: '8000'
        spec:
            serviceAccountName: api
            enableServiceLinks: false
            imagePullSecrets:
                - name: sweetrpg-registry
            containers:
                - name: app
                  image: catalog-api
                  imagePullPolicy: Always
                  envFrom:
                      - configMapRef:
                            name: api-common
                      - configMapRef:
                            name: api-env
                      - secretRef:
                            name: api-db
                      - secretRef:
                            name: api-auth
                      - secretRef:
                            name: api-misc
                      - secretRef:
                            name: api-cache
                  env: []
                  ports:
                      - containerPort: 8000
                        name: http
                  resources:
                      requests:
                          cpu: "20m"
                          memory: "55Mi"
                      limits:
                          cpu: "1.0"
                          memory: "1Gi"
                  livenessProbe:
                        httpGet:
                            path: /status/ping
                            port: http
                        initialDelaySeconds: 90
                        timeoutSeconds: 10
                        interval: 10
                  readinessProbe:
                        # Deliberately the shallow /status/ping, not /status/health - readiness
                        # gates whether this pod receives traffic at all, and /status/health does
                        # live Mongo + Redis checks against Atlas's M0 (shared, free-tier)
                        # cluster. Every replica hits the same Atlas cluster, so a single
                        # transient blip there was taking every pod NotReady simultaneously -
                        # a full outage from a momentary dependency hiccup the process itself
                        # was otherwise fine to keep serving through. /status/health stays
                        # available as an observability endpoint; it just no longer controls
                        # routing.
                        httpGet:
                            path: /status/ping
                            port: http
                        initialDelaySeconds: 10
                        timeoutSeconds: 10
                        periodSeconds: 10
                  volumeMounts:
                      - mountPath: /data
                        name: data
                    #   - mountPath: /config
                    #     name: config
            volumes:
                # - name: config
                #   secret:
                #       secretName: api-files
                #       items:
                #           - key: newrelic.ini
                #             path: newrelic.ini
                - name: data
                  emptyDir: {}
            restartPolicy: Always
