---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: dev
  # mongodb.go builds the connection string from these DB_* parts rather than one opaque
  # DB_URI - only the password (DB_PW, in secrets.yaml) is sensitive. DB_HOST is Atlas's own
  # SRV hostname for Cluster0 - not secret, but not derivable from anything else in this repo.
  DB_SCHEME: mongodb+srv
  DB_HOST: cluster0.z9nxg.mongodb.net
  DB_USER: catalog-api
  DB_NAME: sweetrpg-catalog
  DB_OPTS: retryWrites=true&w=majority
  BUILD_INFO_PATH: /app/config/build-info.json
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318/
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.observability.svc.cluster.local:4040
  PYROSCOPE_TENANT_ID: psw
  SENTRY_RELEASE: "1"
  # The infra repo's catalog/cache chart migrated from Bitnami's redis chart (which used a
  # "<release>-master" Service name) to the Valkey chart with fullnameOverride: cache - the
  # Service is just "cache" now. "redis-master" never resolved, which is part of why this was
  # never exercised end-to-end. See openspec/changes/catalog-api-caching-rate-limiting.
  REDIS_HOST: cache.sweetrpg-catalog.svc.cluster.local
  REDIS_PORT: "6379"
  CACHE_TTLS: "licenses=30m,volumes=30m,systems=2h,publishers=2h,studios=2h,persons=1h,contributions=1h,reviews=15m"
  CACHE_DEFAULT_TTL: 1h
  DISTRIBUTED_RATE_LIMIT_ENABLED: "false"
  RATE_LIMIT_CHEAP: "120"
  RATE_LIMIT_CHEAP_WINDOW_SECONDS: "60"
  RATE_LIMIT_STANDARD: "30"
  RATE_LIMIT_STANDARD_WINDOW_SECONDS: "60"
  INGRESS_BASE_PATH: /api/0/catalog
  INGRESS_HOST: dev.sweetrpg.com
  INGRESS_SCHEMES: http,https
  # Unset until now - authz.NewClient/assets.NewClient fail open to an empty baseURL rather than
  # refusing to start, so this was silently returning "authz_unavailable" 503s on every request
  # needing an authz check (e.g. volume-edit's vocabulary fetch) instead of a startup error.
  AUTH_API_URL: http://api-v1.sweetrpg-auth.svc.cluster.local:8000
  ASSETS_WEB_URL: http://web-v1.sweetrpg-assets.svc.cluster.local:8081
  GAMESYSTEMS_API_URL: http://api-v1.sweetrpg-gamesystems.svc.cluster.local:8000
