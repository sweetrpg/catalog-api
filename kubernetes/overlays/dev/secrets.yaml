---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-auth

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless value atlas-db-user.yaml's ExternalSecret reads (unrewritten there,
        # since the Atlas Operator expects the key name "password") - one password, read by
        # two ExternalSecrets, so this app and the Atlas-side user the Operator provisions
        # always agree on it.
        - extract:
              key: /sweetrpg/catalog/api/atlas-db-password
          rewrite:
              - regexp:
                    source: "(.*)"
                    target: DB_PW

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/api/misc
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: "catalog-api-health-token"
          rewrite:
            - regexp:
                source: "(.*)"
                target: HEALTH_TOKEN

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-cache

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-cache
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/cache/auth

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-files

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-files
        creationPolicy: Owner
        template:
            type: Opaque
            data:
                newrelic.ini: "{{ .contents | toString }}"
    data:
        - secretKey: contents
          remoteRef:
              key: NewRelic

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password

metadata:
  name: catalog-api-health-token

spec:
  length: 53
  digits: 5
  symbols: 5
  symbolCharacters: "-_$@"
  noUpper: false
  allowRepeat: true
