---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
    name: catalog-api-auth

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
    name: catalog-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/api/db

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
    name: catalog-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/api/misc
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: "catalog-api-health-token"
          rewrite:
            - regexp:
                source: "(.*)"
                target: HEALTH_TOKEN

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
    name: catalog-api-cache

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-cache
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/support/cache/client

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
    name: catalog-api-files

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-files
        creationPolicy: Owner
        template:
            type: Opaque
            data:
                newrelic.ini: "{{ .contents | toString }}"
    data:
        - secretKey: contents
          remoteRef:
              key: NewRelic

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password

metadata:
  name: catalog-api-health-token

spec:
  length: 53
  digits: 5
  symbols: 5
  symbolCharacters: "-_$@"
  noUpper: false
  allowRepeat: true
