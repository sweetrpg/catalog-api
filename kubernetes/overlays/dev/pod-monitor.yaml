---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
  name: sweetrpg-catalog-api
  # If labels are defined in spec.podMonitorSelector.matchLabels of your deployed Prometheus object, make sure to include them here.
  labels:
    release: prometheus

spec:
  podMetricsEndpoints:
    - port: http
  selector:
    matchLabels:
        platform: sweetrpg
        app: api
        package: catalog
        component: api
  namespaceSelector:
    matchNames:
      - sweetrpg-catalog
