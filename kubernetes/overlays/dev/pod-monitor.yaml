---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
  name: sweetrpg-catalog-api
  # If labels are defined in spec.podMonitorSelector.matchLabels of your deployed Prometheus object, make sure to include them here.
  labels:
    release: prometheus

spec:
  podMetricsEndpoints:
    - port: http
  selector:
    matchLabels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: catalog
  namespaceSelector:
    matchNames:
      - sweetrpg-catalog
