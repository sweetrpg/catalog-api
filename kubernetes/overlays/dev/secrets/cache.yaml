---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-cache

spec:
    refreshInterval: 12h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-cache
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/cache/auth
