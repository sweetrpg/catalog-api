---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-auth

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
# Local dev only - points at the shared, no-auth MongoDB in sweetrpg-support
# (sweetrpg/common-infrastructure's database module) instead of the real Atlas cluster dev/prod
# use (see that ExternalSecret in kubernetes/overlays/dev/secrets.yaml). This cluster's network
# can't reliably reach Atlas - confirmed via TCP-level testing while debugging admin-api's
# failing readiness probe (same shared Atlas cluster).
apiVersion: v1
kind: Secret

metadata:
    name: api-db

type: Opaque
stringData:
    DB_URI: mongodb://mongodb.sweetrpg-support.svc.cluster.local:27017/sweetrpg-catalog

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/api/misc
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: "catalog-api-health-token"
          rewrite:
            - regexp:
                source: "(.*)"
                target: HEALTH_TOKEN

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-cache

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-cache
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/catalog/cache/auth

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: catalog-api-files

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-files
        creationPolicy: Owner
        template:
            type: Opaque
            data:
                newrelic.ini: "{{ .contents | toString }}"
    data:
        - secretKey: contents
          remoteRef:
              key: NewRelic

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password

metadata:
  name: catalog-api-health-token

spec:
  length: 53
  digits: 5
  symbols: 5
  symbolCharacters: "-_$@"
  noUpper: false
  allowRepeat: true
