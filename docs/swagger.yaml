          description: OK
          schema:
            $ref: '#/definitions/server.vocabularyResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List a vocabulary's values
      tags:
      - vocabularies
    post:
      consumes:
      - application/json
