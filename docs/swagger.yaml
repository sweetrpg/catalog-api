  /users/{userId}/submission-cap:
    put:
      consumes:
      - application/json
      description: admin only. Omit "cap" (or pass null) to clear the override, falling
        the user back to the platform default.
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Cap to set, or null to clear
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.setSubmissionCapRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.submissionCapResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Set a user's submission cap override
      tags:
      - users
  /vocabularies/{type}:
