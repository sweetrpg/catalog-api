  /volumes/tags:
    get:
      description: Returns the distinct tag names on live volumes, most-used first,
        capped by limit. The tag cloud drops its low-frequency tail, so callers pass
        a limit to control how many tags come back.
      parameters:
      - description: Maximum number of tags to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema: {}
