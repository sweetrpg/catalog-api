definitions:
  server.acceptVersionRequest:
    properties:
      fields:
        description: |-
          Fields lists which changed field names to accept; the rest are left unaccepted. Nil (the
          key omitted entirely) means accept every changed field.
        items:
          type: string
        type: array
    type: object
  server.addVocabularyRequest:
    properties:
      value:
        type: string
    type: object
  server.catalogStatsResponse:
    properties:
      licenses:
        $ref: '#/definitions/server.typeStatsVO'
      persons:
        $ref: '#/definitions/server.typeStatsVO'
      publishers:
        $ref: '#/definitions/server.typeStatsVO'
      studios:
        $ref: '#/definitions/server.typeStatsVO'
      systems:
        $ref: '#/definitions/server.typeStatsVO'
      volumes:
        $ref: '#/definitions/server.typeStatsVO'
    type: object
  server.createVolumeRequest:
    properties:
      coverAssetId:
        type: string
      description:
        type: string
      format:
        type: string
      notes:
        type: string
      properties:
        items:
          $ref: '#/definitions/server.propertyRequest'
        type: array
      publisherIds:
        items:
          type: string
        type: array
      sampleAssetIds:
        items:
          type: string
        type: array
      studioIds:
        items:
          type: string
        type: array
      systemIds:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  server.creditRequest:
    properties:
      contributionType:
        type: string
      personId:
        type: string
    type: object
  server.patchVolumeRequest:
    properties:
      coverAssetId:
        type: string
      credits:
        items:
          $ref: '#/definitions/server.creditRequest'
        type: array
      description:
        type: string
      format:
        type: string
      notes:
        type: string
      properties:
        items:
          $ref: '#/definitions/server.propertyRequest'
        type: array
      publisherIds:
        items:
          type: string
        type: array
      sampleAssetIds:
        items:
          type: string
        type: array
      studioIds:
        items:
          type: string
        type: array
      systemIds:
        items:
          type: string
        type: array
      systemTitles:
        additionalProperties:
          type: string
        description: |-
          SystemTitles is an advisory id->title hint from the caller (e.g. the edit dialog's
          already-loaded system names); catalog-api overwrites it from an authoritative
          game-systems-api lookup when reachable, and falls back to it only when that lookup fails.
        type: object
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  server.pendingStagedAssetsResponse:
    properties:
      coverAssetIds:
        items:
          type: string
        type: array
      sampleAssetIds:
        items:
          type: string
        type: array
    type: object
  server.propertyRequest:
    properties:
      kind:
        type: string
      name:
        type: string
      value:
        type: string
    type: object
  server.pullBackVersionResponse:
    properties:
      recordId:
        type: string
      status:
        type: string
    type: object
  server.rejectVersionRequest:
    properties:
      note:
        type: string
    type: object
  server.reviewVersionResponse:
    properties:
      conflicts:
        items:
          type: string
        type: array
      state:
        type: string
      version:
        type: integer
    type: object
  server.setSubmissionCapRequest:
    properties:
      cap:
        type: integer
    type: object
  server.submissionCapResponse:
    properties:
      cap:
        type: integer
      userId:
        type: string
    type: object
  server.submittedVersionResponse:
    properties:
      message:
        type: string
      state:
        type: string
      version:
        type: integer
    type: object
  server.typeStatsMostRecentVO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  server.typeStatsVO:
    properties:
      count:
        type: integer
      last_updated:
        type: string
      most_recent:
        $ref: '#/definitions/server.typeStatsMostRecentVO'
    type: object
  server.vocabularyResponse:
    properties:
      type:
        type: string
      values:
        items:
          type: string
        type: array
    type: object
  vo.ErrorVO:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  vo.HealthResponseVO:
    properties:
      collections:
        items:
          type: string
        type: array
      database:
        type: string
      errors:
        type: integer
      messages:
        items:
          type: string
        type: array
      ping:
        type: string
    type: object
  vo.LicenseVO:
    properties:
      availability:
        type: string
      created_at:
        description: |-
          Audit fields are direct fields, not an embedded modelcore.AuditableVO: google/jsonapi
          v1.0.0 skips untagged struct fields, so an embedded struct never reaches the wire.
          Times are RFC 3339 strings, which is what catalog-web's decoder expects.
        type: string
      created_by:
        type: string
      deed:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      id:
        type: string
      legal_code:
        type: string
      notes:
        type: string
      properties:
        items:
          $ref: '#/definitions/vo.PropertyVO'
        type: array
      short_title:
        type: string
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/vo.TagVO'
        type: array
      title:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: string
      website:
        type: string
    type: object
  vo.PingResponseVO:
    properties:
      date:
        type: string
      hostname:
        type: string
    type: object
  vo.PropertyVO:
    properties:
      kind:
        type: string
      name:
        type: string
      value:
        type: string
    type: object
  vo.PublisherVO:
    properties:
      address:
        type: string
      created_at:
        description: |-
          Audit fields are direct fields, not an embedded modelcore.AuditableVO: google/jsonapi
          v1.0.0 skips untagged struct fields, so an embedded struct never reaches the wire.
          Times are RFC 3339 strings, which is what catalog-web's decoder expects.
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      properties:
        items:
          $ref: '#/definitions/vo.PropertyVO'
        type: array
      tags:
        items:
          $ref: '#/definitions/vo.TagVO'
        type: array
      updated_at:
        type: string
      updated_by:
        type: string
      website:
        type: string
    type: object
  vo.StudioVO:
    properties:
      created_at:
        description: |-
          Audit fields are direct fields, not an embedded modelcore.AuditableVO: google/jsonapi
          v1.0.0 skips untagged struct fields, so an embedded struct never reaches the wire.
          Times are RFC 3339 strings, which is what catalog-web's decoder expects.
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      properties:
        items:
          $ref: '#/definitions/vo.PropertyVO'
        type: array
      tags:
        items:
          $ref: '#/definitions/vo.TagVO'
        type: array
      updated_at:
        type: string
      updated_by:
        type: string
      website:
        type: string
    type: object
  vo.SystemVO:
    properties:
      created_at:
        description: |-
          Audit fields are direct fields, not an embedded modelcore.AuditableVO: google/jsonapi
          v1.0.0 skips untagged struct fields, so an embedded struct never reaches the wire.
          Times are RFC 3339 strings, which is what catalog-web's decoder expects.
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      edition:
        type: string
      game_system:
        description: |-
          GameSystem holds the game system's display name (e.g. "Dungeons & Dragons") - tagged
          "name" on the wire, not "game_system", so catalog-api-client.swift's generic
          NamedAttributes decoder (name ?? title ?? "Untitled") picks it up the same way it
          already does for Publisher/Studio/Person/License.
        type: string
      id:
        type: string
      notes:
        type: string
      tags:
        items:
          $ref: '#/definitions/vo.TagVO'
        type: array
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  vo.TagVO:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  vo.VersionState:
    enum:
    - submitted
    - live
    - archived
    - rejected
    - partially_accepted
    - withdrawn
    type: string
    x-enum-varnames:
    - VersionStateSubmitted
    - VersionStateLive
    - VersionStateArchived
    - VersionStateRejected
    - VersionStatePartiallyAccepted
    - VersionStateWithdrawn
  vo.VolumeVersionVO:
    properties:
      baseVersion:
        type: integer
      coverAssetId:
        type: string
      description:
        type: string
      format:
        type: string
      id:
        type: string
      licenses:
        items:
          $ref: '#/definitions/vo.LicenseVO'
        type: array
      notes:
        type: string
      properties:
        items:
          $ref: '#/definitions/vo.PropertyVO'
        type: array
      publishers:
        items:
          $ref: '#/definitions/vo.PublisherVO'
        type: array
      recordId:
        type: string
      resultingVersion:
        type: integer
      reviewNote:
        type: string
      reviewedAt:
        type: string
      reviewedBy:
        type: string
      sampleAssetIds:
        items:
          type: string
        type: array
      stagedCoverAssetId:
        description: |-
          StagedCoverAssetId/StagedSampleAssetIds mirror VolumeVersion's staged fields - see that
          model's doc comment.
        type: string
      stagedSampleAssetIds:
        items:
          type: string
        type: array
      state:
        $ref: '#/definitions/vo.VersionState'
      studios:
        items:
          $ref: '#/definitions/vo.StudioVO'
        type: array
      submittedAt:
        type: string
      submittedBy:
        type: string
      systemTitles:
        additionalProperties:
          type: string
        description: 'SystemTitles: denormalized system display names keyed by system
          ID - see VolumeVO.'
        type: object
      systems:
        items:
          $ref: '#/definitions/vo.SystemVO'
        type: array
      tags:
        items:
          $ref: '#/definitions/vo.TagVO'
        type: array
      title:
        type: string
      version:
        type: integer
    type: object
info:
  contact:
    email: admin@sweetrpg.com
