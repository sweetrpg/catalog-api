  /volumes:
    get:
      description: Lists the volumes in the database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: List volumes
      tags:
      - volumes
    post:
      consumes:
      - application/json
      description: Creates a new volume. Like POST /publishers, a brand-new record
        is live immediately for every write role - there is no prior version for a
        submission to be reviewed against. Title is required.
      parameters:
      - description: Volume to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.createVolumeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Create a volume
      tags:
      - volumes
  /volumes/{id}:
    delete:
      description: Soft-deletes a volume, hiding it from list/browse/picker reads
        without removing it.
      parameters:
      - description: Volume ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Delete a volume
      tags:
      - volumes
    get:
      description: Get the details of a volume from the database.
      parameters:
      - description: Volume ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Get a volume
      tags:
      - volumes
    patch:
      consumes:
      - application/json
      description: admin/editor roles create a new version that goes live immediately;
        submitter-only roles create a submitted version for review instead.
      parameters:
      - description: Volume ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.patchVolumeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/server.submittedVersionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Edit a volume
      tags:
      - volumes
  /volumes/{id}/contributions:
    get:
      description: |-
        Lists every contribution (person credit) for a single volume, filtered at the
        query layer rather than by fetching the whole /contributions collection.
      parameters:
      - description: Volume ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Get volume contributions
      tags:
      - volumes
  /volumes/{id}/finalize-session:
    post:
      description: Reads the caller's in-flight edit session for this volume. admin/editor
        roles apply it directly (promoting any staged cover/samples to live); submitter
        roles create a submitted version referencing the staged assets without promoting
        them.
      parameters:
      - description: Volume ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
