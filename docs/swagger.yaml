          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Finalize a volume edit session
      tags:
      - volumes
  /volumes/{id}/restore:
    post:
      description: Clears a soft-deleted volume's deletion, returning it to normal
        read paths.
      parameters:
      - description: Volume ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
